<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none';" />
  <title>Seven Code — Terminal</title>
</head>
<body>
  <header><span class="symbol">❮7❯</span><strong>Seven Code</strong><small>Terminal local • Android</small></header>
  <main id="terminal" aria-label="Terminal Seven Code"></main>
  <nav aria-label="Teclas especiais">
    <button data-key="\u001b">ESC</button><button data-key="\t">TAB</button>
    <button data-key="\u0003">CTRL+C</button>
    <button data-key="\u001b[A">↑</button><button data-key="\u001b[B">↓</button>
    <button data-key="\u001b[D">←</button><button data-key="\u001b[C">→</button>
  </nav>
  <script type="module" src="/src/main.ts"></script>
</body>
