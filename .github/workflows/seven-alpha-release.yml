# Legacy Alpha 1 publishing is retired to prevent unverified mobile releases.
# Historical tags/releases are unchanged. Mobile distributions must use a
# new workflow with signed artifacts and proven end-to-end qualification.
name: Seven Code Legacy Alpha 1 (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Legacy release route disabled: use verified release qualification."
          exit 1
