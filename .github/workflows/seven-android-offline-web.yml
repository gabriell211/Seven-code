name: Seven Code Android - original Web workbench OFFLINE APK (test only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seven-android-offline-web.yml"
      - ".seven/package-android-web.mjs"
      - ".seven/tests/android-preview-install.test.mjs"
      - ".seven/android/verify-preview-coinstall-emulator.sh"
      - ".seven/android/localize-codeoss-web.mjs"
      - ".seven/tests/android-localization.test.mjs"
      - ".seven/tests/android-system-ime.test.mjs"
      - ".seven/tests/android-screen-resume-ai.test.mjs"
      - "extensions/copilot/**"
      - ".seven/tests/android-copilot-chat-command.test.mjs"
      - "extensions/github-authentication/**"
      - ".seven/tests/android-github-device-auth.test.mjs"
      - ".seven/tests/android-copilot-chat-command.test.mjs"
      - "extensions/seven-code-mobile-terminal/**"
      - "src/vs/workbench/browser/sevenMobileTerminalBridge.ts"
      - "src/vs/workbench/browser/media/sevenMobileAndroid.css"
      - "src/vs/workbench/contrib/chat/browser/chatStatus/chatStatusDashboard.ts"
      - "mobile/android/app/src/androidTest/java/dev/seven/code/SevenOfflineWebWorkbenchDeviceTest.kt"
      - ".seven/verify-android-web.mjs"
      - ".seven/tests/android-web-bundle.test.mjs"
      - "mobile/android/app/src/main/**"
      - "mobile/android/app/build.gradle.kts"
      - "mobile/android/app/src/androidTest/java/dev/seven/code/SevenOfflineWebWorkbenchDeviceTest.kt"
      - "build/gulpfile.vscode.web.ts"
      - "src/vs/code/browser/workbench/**"
  pull_request:
    branches: [main]
    paths:
      - "extensions/github-authentication/**"
      - ".seven/tests/android-github-device-auth.test.mjs"
      - ".seven/tests/android-copilot-chat-command.test.mjs"
      - "extensions/seven-code-mobile-terminal/**"
      - "src/vs/workbench/browser/sevenMobileTerminalBridge.ts"
      - "src/vs/workbench/browser/media/sevenMobileAndroid.css"
      - "src/vs/workbench/contrib/chat/browser/chatStatus/chatStatusDashboard.ts"
      - "mobile/android/app/src/androidTest/java/dev/seven/code/SevenOfflineWebWorkbenchDeviceTest.kt"
      - ".github/workflows/seven-android-offline-web.yml"
      - ".seven/package-android-web.mjs"
      - ".seven/tests/android-preview-install.test.mjs"
      - ".seven/android/verify-preview-coinstall-emulator.sh"
      - ".seven/android/localize-codeoss-web.mjs"
      - ".seven/tests/android-localization.test.mjs"
      - ".seven/tests/android-system-ime.test.mjs"
      - ".seven/tests/android-screen-resume-ai.test.mjs"
      - ".seven/verify-android-web.mjs"
      - ".seven/tests/android-web-bundle.test.mjs"
      - "mobile/android/app/src/main/**"
      - "mobile/android/app/build.gradle.kts"
      - "mobile/android/app/src/androidTest/java/dev/seven/code/SevenOfflineWebWorkbenchDeviceTest.kt"
      - "build/gulpfile.vscode.web.ts"
      - "src/vs/code/browser/workbench/**"

permissions:
  contents: read

concurrency:
  group: seven-android-offline-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-web-in-apk:
    name: Bundle real Code OSS Web in APK and test emulator startup
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      VSCODE_QUALITY: oss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Code OSS native build requirements and Android SDK
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-1-dev libkrb5-dev libx11-dev libxkbfile-dev libnotify-dev libnss3-dev libatk-bridge2.0-dev libasound2-dev libgbm-dev unzip binutils
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Install exactly pinned Code OSS dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile the genuine upstream Copilot Chat WEB extension host
        run: |
          set -euo pipefail
          npm --prefix extensions/copilot run compile
          test -s extensions/copilot/dist/web.js
          test "$(stat -c %s extensions/copilot/dist/web.js)" -gt 100000
      - name: Compile original GitHub authentication Web Worker with Android transport
        run: |
          set -euo pipefail
          npm --prefix extensions/github-authentication run compile-web
          test -s extensions/github-authentication/dist/browser/extension.js
          test "$(stat -c %s extensions/github-authentication/dist/browser/extension.js)" -gt 15000
      - name: Compile ORIGINAL Code OSS web production workbench (NOT a mock)
        run: npm run gulp vscode-web-min
      - name: Download and verify pinned MIT-licensed official pt-BR translations
        env:
          VSCODE_LOC_SHA: 62d5443b567022539ba6e8565b0f43f5f6b3682b
          PTBR_BLOB_SHA: 97d55c2befdf7f606f399a8f5526b635d777c784
          LICENSE_BLOB_SHA: 1adca5b75d5d39e0bf1e9a7c06c9a43a09b1f27e
        run: |
          set -euo pipefail
          source_url="https://raw.githubusercontent.com/microsoft/vscode-loc/${VSCODE_LOC_SHA}"
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            "${source_url}/i18n/vscode-language-pack-pt-BR/translations/main.i18n.json" \
            -o "$RUNNER_TEMP/seven-code-pt-br-main.i18n.json"
          test "$(git hash-object "$RUNNER_TEMP/seven-code-pt-br-main.i18n.json")" = "$PTBR_BLOB_SHA"
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
            "${source_url}/LICENSE.md" -o "$RUNNER_TEMP/seven-code-pt-br-LICENSE.md"
          test "$(git hash-object "$RUNNER_TEMP/seven-code-pt-br-LICENSE.md")" = "$LICENSE_BLOB_SHA"
      - name: Embed complete compiled Web UI into Android assets
        run: |
          set -euo pipefail
          node .seven/package-android-web.mjs ../vscode-web
          node .seven/android/localize-codeoss-web.mjs \
            mobile/android/app/src/main/assets/seven-web \
            "$RUNNER_TEMP/seven-code-pt-br-main.i18n.json"
          mkdir -p mobile/android/app/src/main/assets/seven-web/licenses
          cp "$RUNNER_TEMP/seven-code-pt-br-LICENSE.md" \
            mobile/android/app/src/main/assets/seven-web/licenses/vscode-loc-LICENSE.md
          node --test .seven/tests/android-screen-resume-ai.test.mjs .seven/tests/android-preview-install.test.mjs .seven/tests/android-web-bundle.test.mjs .seven/tests/android-localization.test.mjs .seven/tests/android-system-ime.test.mjs .seven/tests/android-copilot-chat-command.test.mjs .seven/tests/android-copilot-shell-tool.test.mjs .seven/tests/android-github-device-auth.test.mjs
          test -s mobile/android/app/src/main/assets/seven-web/out/vs/workbench/workbench.web.main.internal.js
          test -s mobile/android/app/src/main/assets/seven-web/extensions/copilot-chat/dist/web.js
      - name: Build APK with Android native PTY and embedded Code OSS Web UI
        run: gradle -p mobile/android :app:assembleDebug -PsevenPreviewIsolated=true --no-daemon --stacktrace
      - name: Reject WebView-only shell or broken/unrendered editor assets
        run: |
          set -euo pipefail
          apk="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          node .seven/verify-android-web.mjs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee "$RUNNER_TEMP/seven-preview-badging.txt"
          grep -F "package: name='dev.seven.code.preview'" "$RUNNER_TEMP/seven-preview-badging.txt"
          grep -F "versionCode='3'" "$RUNNER_TEMP/seven-preview-badging.txt"
          sha256sum "$apk"
      - name: Require real hardware acceleration for emulator E2E
        run: |
          test -e /dev/kvm || { echo "::error::Hosted runner has no KVM"; exit 1; }
          sudo chmod 666 /dev/kvm
      - name: Boot real Android WebView, upgrade-safe side-by-side installation and functional editor E2E
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash .seven/android/verify-preview-coinstall-emulator.sh
      - name: Attach APK ONLY after actual on-emulator Web Workbench test passes
        run: |
          mkdir -p "$RUNNER_TEMP/offline-web-apk"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk             "$RUNNER_TEMP/offline-web-apk/SevenCode-Android-Web-offline-tested-debug.apk"
          (cd "$RUNNER_TEMP/offline-web-apk" && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: SevenCode-Android-Web-offline-emulator-verified
          path: ${{ runner.temp }}/offline-web-apk/
          if-no-files-found: error
          retention-days: 14
