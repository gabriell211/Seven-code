name: Seven Code Alpha 3 Full Release

on:
  push:
    branches:
      - release/v0.1.0-alpha.3

permissions:
  contents: write

concurrency:
  group: seven-code-alpha3-release
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel superseded alpha builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for workflow in seven-alpha2-release.yml seven-alpha3-release.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 30 \
              --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId' |
            while read -r run_id; do
              if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || echo "Run $run_id already finished or cancellation unavailable."
              fi
            done
          done

  android:
    needs: cancel-stale
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check terminal and mobile features
        run: |
          node --test .seven/tests/mobile-workbench.test.mjs
          node --experimental-strip-types --test mobile/capabilities/capability-resolver.test.mjs
          node --experimental-strip-types --test mobile/remote/seven-workspace-client.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Android toolchains
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build native Android workbench host APK
        run: gradle -p mobile/android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify Android package contents and native PTY architectures
        run: node .seven/verify-android-apk.mjs
      - name: Prepare release artifact
        run: |
          mkdir -p release-assets
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk release-assets/SevenCode-v0.1.0-alpha.3-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SevenCode-Android-Alpha
          path: release-assets/*.apk
          if-no-files-found: error

  ios:
    needs: cancel-stale
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec mobile/ios/project.yml --project mobile/ios
      - name: Compile iOS simulator host
        run: |
          xcodebuild -project mobile/ios/SevenCode.xcodeproj \
            -scheme SevenCode -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/seven-code-ios" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/seven-code-ios/Build/Products/Debug-iphonesimulator/SevenCode.app" \
            release-assets/SevenCode-v0.1.0-alpha.3-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SevenCode-iOS-Alpha
          path: release-assets/*.zip
          if-no-files-found: error

  server:
    needs: cancel-stale
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      VSCODE_QUALITY: oss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install upstream native build prerequisites
        run: |
          packages=(libsecret-1-dev libkrb5-dev libx11-dev libxkbfile-dev libnotify-dev libnss3-dev libatk-bridge2.0-dev libasound2-dev libgbm-dev)
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          if ! timeout 180s sudo apt-get "${apt_options[@]}" install -y -qq "${packages[@]}"; then
            timeout 180s sudo apt-get "${apt_options[@]}" update -qq
            timeout 180s sudo apt-get "${apt_options[@]}" install -y -qq "${packages[@]}"
          fi
      - name: Install exact Code OSS dependencies
        run: |
          test -s .github/copilot-instructions.md
          test -s extensions/copilot/.github/copilot-instructions.md
          test -d .agents/skills
          npm ci --no-audit --no-fund
      - name: Compile complete Code OSS server, web workbench and extension hosts
        run: |
          npm run gulp compile-web
          npm run gulp vscode-reh-web-linux-x64-min
      - name: Validate compiled Code OSS server and all major runtime components
        run: |
          set -euo pipefail
          root="../vscode-reh-web-linux-x64"
          test -d "$root"
          test -s "$root/out/server-main.js"
          test -s "$root/out/vs/code/browser/workbench/workbench.js"
          test -d "$root/extensions"
          test -d "$root/node_modules"
          test -x "$root/bin/seven-code-server"
          test "$(du -sm "$root" | cut -f1)" -ge 30
          "$root/bin/seven-code-server" --help >/tmp/seven-code-help.txt
          head -35 /tmp/seven-code-help.txt
          du -sh "$root"
          node .seven/verify-server.mjs "$root"
      - name: Archive verified server and checksum
        run: |
          mkdir -p release-assets
          tar -C .. -czf release-assets/SevenCode-Server-Web-linux-x64.tar.gz vscode-reh-web-linux-x64
          test "$(stat -c %s release-assets/SevenCode-Server-Web-linux-x64.tar.gz)" -ge 15000000
          sha256sum release-assets/SevenCode-Server-Web-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: SevenCode-Server-Alpha
          path: release-assets/SevenCode-Server-Web-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [android, ios, server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SevenCode-*-Alpha
          merge-multiple: true
          path: release-assets
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.apk *.zip *.tar.gz > SHA256SUMS.txt
      - name: Block publication without real full-stack E2E proof
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .seven/require-release-checks.mjs
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v0.1.0-alpha.3" --jq .object.sha)
          test "$branch_sha" = "$GITHUB_SHA" || { echo "Release branch advanced; refusing stale artifacts."; exit 1; }
          if gh release view v0.1.0-alpha.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite its assets."
            exit 1
          fi
          gh release create v0.1.0-alpha.3 release-assets/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Seven Code v0.1.0-alpha.3 — Android/iOS Workbench (preview)" \
            --notes-file docs/RELEASE-ALPHA-3.md \
            --prerelease --latest=false
