name: Seven Code Android terminal build

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/seven-mobile-android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/seven-mobile-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-code-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Testar o contrato execute_command
        run: node --experimental-strip-types --test mobile/terminal-core/ai-terminal-tool.test.mjs
      - name: Verificar todas as áreas do editor móvel
        run: node --experimental-strip-types --test mobile/capabilities/capability-resolver.test.mjs
      - name: Testar cliente de workspace remoto seguro
        run: node --experimental-strip-types --test mobile/remote/seven-workspace-client.test.mjs
          node --test .seven/tests/mobile-workbench.test.mjs
          node --test .seven/tests/android-pty-process.test.mjs
      - name: Construir interface xterm.js
        working-directory: mobile/terminal-ui
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Compilar APK de testes (não assinado para distribuição)
        run: gradle -p mobile/android :app:assembleDebug --no-daemon --stacktrace
      - name: Habilitar KVM para testes reais no emulador
        run: |
          test -e /dev/kvm || { echo '::error::Hosted runner has no KVM; real emulator test cannot pass'; exit 1; }
          sudo chmod 666 /dev/kvm
      - name: Executar PTY JNI no emulador Android (não é E2E do editor completo)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle -p mobile/android :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SevenCode-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
