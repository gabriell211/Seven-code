name: Seven Code Android - convert Code OSS native modules to Bionic

on:
  workflow_run:
    workflows: ["Seven Code Android - compile Code OSS ARM64"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  bionic-addons:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Compile Code OSS native Node addons with Android NDK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK r27 and compilation tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'ndk;27.2.12479018'
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils python3
      - name: Download ARM64 Code OSS and Bionic Node from the same signed-source build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          pattern: SevenCode-*
          merge-multiple: false
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs
      - name: Find verified Android inputs
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staging"
          test -s "$RUNNER_TEMP/inputs/SevenCode-CodeOSS-linux-arm64-build/SevenCode-CodeOSS-linux-arm64-build.tar.gz"
          test -s "$RUNNER_TEMP/inputs/SevenCode-Node-Android-Bionic-arm64/SevenCode-Node-Android-Bionic-arm64.tar.gz"
          tar xf "$RUNNER_TEMP/inputs/SevenCode-CodeOSS-linux-arm64-build/SevenCode-CodeOSS-linux-arm64-build.tar.gz" -C "$RUNNER_TEMP/staging"
          tar xf "$RUNNER_TEMP/inputs/SevenCode-Node-Android-Bionic-arm64/SevenCode-Node-Android-Bionic-arm64.tar.gz" -C "$RUNNER_TEMP/staging"
          test -s "$RUNNER_TEMP/staging/vscode-reh-web-linux-arm64/out/server-main.js"
          test -s "$RUNNER_TEMP/staging/seven-bionic/libnode.so"
          echo "CODEOSS_PATH=$RUNNER_TEMP/staging/vscode-reh-web-linux-arm64" >> "$GITHUB_ENV"
          echo "BIONIC_PATH=$RUNNER_TEMP/staging/seven-bionic" >> "$GITHUB_ENV"
      - name: Compile native Android/Bionic PTY, watcher and SQLite
        if: github.event_name == 'workflow_run'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euo pipefail
          bash mobile/android/tools/build-bionic-addons.sh "$CODEOSS_PATH" "$BIONIC_PATH"
      - name: Audit remaining ABI conversions; never label GNU/Linux modules Android
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          if python3 .seven/android/audit-codeoss-abi.py "$CODEOSS_PATH" --stage android-bionic \
            > "$RUNNER_TEMP/staging/ANDROID-BIONIC-ABI-REPORT.txt" 2>&1; then
            printf '\nABI_STATUS=READY\n' | tee -a "$RUNNER_TEMP/staging/ANDROID-BIONIC-ABI-REPORT.txt"
          else
            printf '\nABI_STATUS=INCOMPLETE: further native modules/helpers must be ported before packaging the APK.\n' \
              | tee -a "$RUNNER_TEMP/staging/ANDROID-BIONIC-ABI-REPORT.txt"
          fi
          cat "$RUNNER_TEMP/staging/ANDROID-BIONIC-ABI-REPORT.txt"
      - name: Upload ported Android native addons for next integration stage
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-bionic"
          cp "$CODEOSS_PATH/node_modules/node-pty/build/Release/pty.node" "$RUNNER_TEMP/native-bionic/pty.node"
          cp "$CODEOSS_PATH/node_modules/@parcel/watcher/build/Release/watcher.node" "$RUNNER_TEMP/native-bionic/watcher.node"
          cp "$CODEOSS_PATH/node_modules/@vscode/sqlite3/build/Release/vscode-sqlite3.node" "$RUNNER_TEMP/native-bionic/vscode-sqlite3.node"
          cp "$RUNNER_TEMP/staging/ANDROID-BIONIC-ABI-REPORT.txt" "$RUNNER_TEMP/native-bionic/ABI-REPORT.txt"
          sha256sum "$RUNNER_TEMP/native-bionic/"*.node
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: SevenCode-Android-Bionic-core-node-addons
          path: ${{ runner.temp }}/native-bionic
          if-no-files-found: error
          retention-days: 14
