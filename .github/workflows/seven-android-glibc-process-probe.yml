name: Seven Code Android - research isolated GNU ARM64 Copilot process

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seven-android-glibc-process-probe.yml"
      - ".seven/android/build-isolated-gnu-runtime.py"
  workflow_run:
    workflows: ["Seven Code Android - compile Code OSS ARM64"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  isolated-glibc-probe:
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    name: Prove separate GNU ARM64 Node/Copilot library closure (NOT Android acceptance)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve verified equivalent Code OSS source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == workflow_run ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            source_sha="${{ github.event.workflow_run.head_sha }}"
          else
            # Fast research iteration: use a successful ARM64 build only when
            # EVERY editor, extension and mobile runtime input matches HEAD.
            run_id=""
            source_sha=""
            while read -r candidate_id candidate_sha; do
              [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || continue
              git fetch --no-tags --depth=1 origin "$candidate_sha"
              if git diff --quiet "$candidate_sha" HEAD -- \
                .github/workflows/seven-android-codeoss-arm64.yml \
                src extensions remote build mobile/android product.json \
                package.json package-lock.json .nvmrc; then
                run_id="$candidate_id"
                source_sha="$candidate_sha"
                break
              fi
            done < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/seven-android-codeoss-arm64.yml/runs?branch=main&status=success&per_page=25" \
                --jq '.workflow_runs[] | "\(.id) \(.head_sha)"'
            )
            test -n "$run_id" || {
              echo "::error::No successful ARM64 Code OSS run with byte-identical runtime sources. Run full Code OSS compilation."
              exit 1
            }
          fi
          [[ "$run_id" =~ ^[0-9]+$ && "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Testing original Code OSS source $source_sha from signed run $run_id"
      - name: Download exact source run - never reuse old binaries
        uses: actions/download-artifact@v4
        with:
          name: SevenCode-CodeOSS-linux-arm64-build
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/inputs
      - name: Extract original Linux ARM64 Code OSS
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test -s "$RUNNER_TEMP/inputs/SevenCode-CodeOSS-linux-arm64-build.tar.gz"
          mkdir -p "$RUNNER_TEMP/compiled"
          tar -xzf "$RUNNER_TEMP/inputs/SevenCode-CodeOSS-linux-arm64-build.tar.gz" -C "$RUNNER_TEMP/compiled"
          test -s "$RUNNER_TEMP/compiled/vscode-reh-web-linux-arm64/node"
          node -e "const p=require(process.argv[1]);if(p.commit!==process.argv[2])throw Error('Downloaded Linux Code OSS product commit differs from resolved source')" \
            "$RUNNER_TEMP/compiled/vscode-reh-web-linux-arm64/product.json" \
            "${{ steps.source.outputs.source_sha }}"
      - name: Build and execute isolated GNU ELF closure on ARM64 Linux
        run: |
          set -euo pipefail
          python3 .seven/android/build-isolated-gnu-runtime.py \
            "$RUNNER_TEMP/compiled/vscode-reh-web-linux-arm64" \
            "$RUNNER_TEMP/gnu-runtime"
          node -e "const m=require(process.argv[1]);if(m.androidVerified!==false||m.releaseEligible!==false||Object.keys(m.originalCopilotElf).length!==4)process.exit(1)" "$RUNNER_TEMP/gnu-runtime/manifest.json"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/gnu-runtime-research.tar.gz" gnu-runtime
          test -s "$RUNNER_TEMP/gnu-runtime-research.tar.gz"
      - name: Actually load original Copilot native addons into isolated GNU ARM64 Node
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/compiled/vscode-reh-web-linux-arm64"
          loader="$RUNNER_TEMP/gnu-runtime/ld-linux-aarch64.so.1"
          node="$RUNNER_TEMP/gnu-runtime/node"
          libs="$RUNNER_TEMP/gnu-runtime/lib"
          # Pure ABI probes are not sufficient: dlopen and N-API registration
          # must succeed with the four ORIGINAL Copilot ELF components.
          LD_LIBRARY_PATH="$libs" "$loader" --library-path "$libs" "$node" -e '
            for (const name of process.argv.slice(1)) {
              const value = require(name);
              if (value == null) throw new Error("Empty native Copilot module: " + name);
              console.log("GNU Copilot addon loaded:", name);
            }
          ' \
            "$root/extensions/copilot/node_modules/@github/copilot/sdk/prebuilds/linux-arm64/runtime.node" \
            "$root/extensions/copilot/node_modules/@github/copilot/sdk/prebuilds/linux-arm64/cli-native.node" \
            "$root/node_modules/@github/copilot-sdk-linux-arm64/prebuilds/linux-arm64/runtime.node"
          "$loader" --verify "$root/node_modules/@github/copilot-sdk-linux-arm64/prebuilds/linux-arm64/copilot-runtime"
          echo "GNU AArch64 original native addons loaded. This is NOT proof of Android compatibility or Copilot OAuth."
      - name: Keep research evidence separate from any APK/release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SevenCode-GNU-arm64-separate-process-research-only
          path: ${{ runner.temp }}/gnu-runtime-research.tar.gz
          retention-days: 7
          if-no-files-found: error
