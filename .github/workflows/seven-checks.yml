name: Seven Code CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validar marca, tema e utilitários
        run: |
          node --check .seven/apply-brand.mjs
          node --test .seven/tests/branding.test.mjs
          node --test build/lib/test/copilotExtensionPackage.test.ts
          node --experimental-strip-types --test mobile/capabilities/capability-resolver.test.mjs
          node --experimental-strip-types --test mobile/terminal-core/ai-terminal-tool.test.mjs
          node --experimental-strip-types --test mobile/remote/seven-workspace-client.test.mjs
          node --test .seven/tests/mobile-workbench.test.mjs
          node --test .seven/tests/android-pty-process.test.mjs
          node --test .seven/tests/release-qualification.test.mjs
          node --test .seven/tests/android-apk-package.test.mjs
          python -m py_compile .seven/render-icons.py
          if [ ! -f product.json ] || [ ! -f src/vs/workbench/workbench.desktop.main.ts ]; then
            echo "::error::A importação do Code - OSS ainda não foi concluída."
            exit 1
          fi
          test -f LICENSE.txt
          test -f ThirdPartyNotices.txt
          test -s .github/copilot-instructions.md
          test -s extensions/copilot/.github/copilot-instructions.md
          test -d .agents/skills
          node -e 'const p=require("./product.json");if(p.nameShort!=="Seven Code"||p.applicationName!=="seven-code"||!p.extensionsGallery?.serviceUrl?.startsWith("https://open-vsx.org/"))process.exit(1)'
