name: Seven Code CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validar marca, tema e utilitários
        run: |
          node --check .seven/apply-brand.mjs
          node --test .seven/tests/branding.test.mjs
          node --test build/lib/test/copilotExtensionPackage.test.ts
          node --experimental-strip-types --test mobile/capabilities/capability-resolver.test.mjs
          node --experimental-strip-types --test mobile/terminal-core/ai-terminal-tool.test.mjs
          node --experimental-strip-types --test mobile/remote/seven-workspace-client.test.mjs
          node --test .seven/tests/mobile-workbench.test.mjs
          node --check extensions/seven-code-mobile-terminal/dist/browser/extension.js
          node --check extensions/seven-code-node-runtime-smoke/extension.js
          node --test .seven/tests/android-node-workspace-e2e-policy.test.mjs
          node --test .seven/tests/android-copilot-chat-command.test.mjs
          node --test .seven/tests/android-copilot-shell-tool.test.mjs
          node --test .seven/tests/android-copilot-context.test.mjs
          node --test .seven/tests/android-phone-workspace.test.mjs
          node --experimental-strip-types --test .seven/tests/android-github-device-auth.test.mjs
          node --test .seven/tests/android-pty-process.test.mjs
          node --test .seven/tests/android-system-ime.test.mjs
          node --test .seven/tests/android-screen-resume-ai.test.mjs
          node --test .seven/tests/android-preview-install.test.mjs
          bash -n .seven/android/verify-preview-coinstall-emulator.sh
          node --test .seven/tests/android-localization.test.mjs
          node --test .seven/tests/release-qualification.test.mjs
          node --test .seven/tests/single-apk-release.test.mjs
          node --check .seven/require-single-apk-release.mjs
          python -m py_compile .seven/verify-standalone-apk.py
          python -m py_compile .seven/android/fetch-bionic-node.py
          python -m py_compile .seven/android/audit-codeoss-abi.py
          python -m py_compile .seven/android/fetch-android-kerberos.py
          python -m py_compile .seven/android/merge-kerberos-runtime.py
          python -m unittest discover -s .seven/android -p 'test_*.py'
          python -m py_compile .seven/android/experimental-glibc/gen-glibc-forwarders.py
          python -m py_compile .seven/android/experimental-glibc/verify-android-elf.py
          bash -n .seven/android/experimental-glibc/build-glibc-shim.sh
          bash -n mobile/android/tools/build-bionic-addons.sh
          bash -n .seven/android/run-gnu-apk-e2e.sh
          node --test .seven/tests/android-apk-package.test.mjs
          node --test .seven/tests/android-local-first.test.mjs
          node --test .seven/tests/android-pipeline-revision.test.mjs
          node --test .seven/tests/android-final-release-policy.test.mjs
          node --check .seven/package-android-gnu-experiment.mjs
          node --test .seven/tests/gnu-node-fork-probe.test.mjs
          node --test .seven/tests/android-gnu-apk-experiment.test.mjs
          node --test .seven/tests/android-gnu-device-e2e.test.mjs
          python -m py_compile .seven/android/verify-gnu-apk.py
          python -m unittest discover -s .seven/android -p 'test_verify_gnu_apk.py'
          python -m unittest discover -s .seven/android -p 'test_isolated_gnu_runtime.py'
          python -m py_compile .seven/render-icons.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ns = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse('mobile/android/app/src/main/AndroidManifest.xml').getroot()
          app = root.find('application')
          assert app is not None
          assert app.attrib[ns + 'networkSecurityConfig'] == '@xml/network_security_config'
          assert app.attrib[ns + 'usesCleartextTraffic'] == 'false'
          config = ET.parse('mobile/android/app/src/main/res/xml/network_security_config.xml').getroot()
          base = config.find('base-config')
          assert base is not None and base.attrib['cleartextTrafficPermitted'] == 'false'
          domains = [(d.text.strip(), d.attrib.get('includeSubdomains', 'false'))
                     for d in config.findall('./domain-config/domain')]
          assert domains == [('127.0.0.1', 'false')], domains
          print('Android manifest and loopback-only network security XML parsed and verified')
          PY
          if [ ! -f product.json ] || [ ! -f src/vs/workbench/workbench.desktop.main.ts ]; then
            echo "::error::A importação do Code - OSS ainda não foi concluída."
            exit 1
          fi
          test -f LICENSE.txt
          test -f ThirdPartyNotices.txt
          test -s .github/copilot-instructions.md
          test -s extensions/copilot/.github/copilot-instructions.md
          test -d .agents/skills
          node -e 'const p=require("./product.json");if(p.nameShort!=="Seven Code"||p.applicationName!=="seven-code"||!p.extensionsGallery?.serviceUrl?.startsWith("https://open-vsx.org/"))process.exit(1)'
