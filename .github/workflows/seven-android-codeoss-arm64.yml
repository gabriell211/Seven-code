name: Seven Code Android - compile Code OSS ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Everything that can change the bundled Code OSS, Copilot, Android
      # host, native addons, or runtime provenance must rebuild from source.
      - ".github/workflows/seven-android-codeoss-arm64.yml"
      - ".seven/android/**"
      # GNU packaging/workflow changes must enter the same ordered build
      # chain as source and Android runtime changes, never a racing APK push.
      - ".seven/package-android-gnu-experiment.mjs"
      - ".github/workflows/seven-android-gnu-apk-experiment.yml"
      - ".github/workflows/seven-android-gnu-device-e2e.yml"
      - ".seven/package-android-local-runtime.mjs"
      - ".seven/verify-standalone-apk.py"
      - "mobile/android/**"
      - "src/**"
      - "extensions/**"
      - "remote/**"
      - "build/**"
      - "product.json"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: seven-code-android-codeoss-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeoss-arm64:
    name: Compile Code OSS web server on native Linux ARM64 runner
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      VSCODE_QUALITY: oss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check native ARM64 build host and MIT Code OSS inputs
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          grep -q 'MIT' LICENSE.txt
          test -s ThirdPartyNotices.txt
          node -e "const p=require('./package.json'); if(p.name!=='seven-code-dev')process.exit(1);console.log('Code OSS',p.version)"
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-1-dev libkrb5-dev libx11-dev libxkbfile-dev libnotify-dev libnss3-dev libatk-bridge2.0-dev libasound2-dev libgbm-dev
      - name: Build upstream Code OSS web workbench and ARM64 extension host from source
        run: |
          npm ci --no-audit --no-fund
          npm run gulp compile-web
          npm run gulp vscode-reh-web-linux-arm64-min
      - name: Qualify ARM64 Code OSS build and report Bionic conversion work
        run: |
          set -euo pipefail
          root="../vscode-reh-web-linux-arm64"
          # Preserve a workspace-only Node extension inside the ORIGINAL Code OSS
          # runtime tree; it verifies child_process.fork + IPC and Copilot N-API
          # on the actual Android device, not on a WebView worker.
          mkdir -p "$root/extensions/seven-code-node-runtime-smoke"
          cp extensions/seven-code-node-runtime-smoke/package.json \
             extensions/seven-code-node-runtime-smoke/extension.js \
             "$root/extensions/seven-code-node-runtime-smoke/"
          test -s "$root/extensions/seven-code-node-runtime-smoke/extension.js"
          test -s "$root/out/server-main.js"
          test -s "$root/out/vs/code/browser/workbench/workbench.js"
          echo "Compiled Code OSS extension host candidates:"
          find "$root/out" -type f -iname '*extensionhost*' -print | head -30
          for name in \
            "out/server-main.js" \
            "out/vs/code/browser/workbench/workbench.js" \
            "extensions/seven-code-mobile-terminal/dist/browser/extension.js" \
            "extensions/copilot/dist/extension.js" \
            "product.json"; do
            test -s "$root/$name" || { echo "::error::ARM64 Code OSS missing $name"; exit 1; }
          done
          test -s "$root/ThirdPartyNotices.txt" || echo "::warning::Server tree missing third party notice; source notice must be inserted before final APK."
          test -s "$root/LICENSE.txt" || echo "::warning::Server tree missing license; source license must be inserted before final APK."
          node -e "const p=require('../vscode-reh-web-linux-arm64/product.json');if(p.nameShort!=='Seven Code'||!/[a-f0-9]{40}/.test(p.commit))process.exit(1)"
          python3 .seven/android/audit-codeoss-abi.py "$root" --stage linux-arm64
          du -sh "$root"
      - name: Save native ARM64 Code OSS compilation as a staging artifact
        run: |
          set -euo pipefail
          tar -C .. -czf "$RUNNER_TEMP/SevenCode-CodeOSS-linux-arm64-build.tar.gz" vscode-reh-web-linux-arm64
          test "$(stat -c %s "$RUNNER_TEMP/SevenCode-CodeOSS-linux-arm64-build.tar.gz")" -ge 15000000
          sha256sum "$RUNNER_TEMP/SevenCode-CodeOSS-linux-arm64-build.tar.gz" | tee "$RUNNER_TEMP/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: SevenCode-CodeOSS-linux-arm64-build
          path: |
            ${{ runner.temp }}/SevenCode-CodeOSS-linux-arm64-build.tar.gz
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  bionic-node:
    name: Obtain signed Android ARM64 Bionic Node runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Termux signing key and download Android Node runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils gnupg
          python3 .seven/android/fetch-bionic-node.py "$RUNNER_TEMP/seven-bionic" --expected-major 24
          test -s "$RUNNER_TEMP/seven-bionic/libnode.so"
          test -s "$RUNNER_TEMP/seven-bionic/android-libs.zip"
          test -s "$RUNNER_TEMP/seven-bionic/NOTICE-node.txt"
          readelf -l "$RUNNER_TEMP/seven-bionic/libnode.so" | grep -F '/system/bin/linker64'
      - name: Pack verified Bionic runtime staging artifact
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/SevenCode-Node-Android-Bionic-arm64.tar.gz" seven-bionic
          sha256sum "$RUNNER_TEMP/SevenCode-Node-Android-Bionic-arm64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: SevenCode-Node-Android-Bionic-arm64
          path: ${{ runner.temp }}/SevenCode-Node-Android-Bionic-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
