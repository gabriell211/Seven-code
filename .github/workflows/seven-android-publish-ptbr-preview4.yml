name: Seven Code Android - publish verified pt-BR isolated Preview 4 APK

# Explicit TEST preview only. Do not bypass GNU ARM64 / live Copilot production gates.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seven-android-publish-ptbr-preview4.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: seven-code-ptbr-preview-publish
  cancel-in-progress: false

jobs:
  publish-verified-android-web-preview:
    name: Verify identical built tree and publish exactly one Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify main source equals emulator-tested PR tree and CI succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 617c6a404c474aca3146abcac4eb97532f9c41c7
          VERIFIED_HEAD_SHA: c788a11f2136d99c17e6c1cee0db152908f085b8
          VERIFIED_RUN_ID: "40262890094"
          RELEASE_TAG: v0.2.0-android-web-preview.4
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA" || {
            echo "::error::The publish workflow must be immediately after the exact tested merge commit"; exit 1;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA" || {
            echo "::error::Main moved; reject stale release"; exit 1;
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" --jq '.head_sha')" = "$VERIFIED_HEAD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" --jq '.event')" = "pull_request"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" --jq '.tree.sha')" = "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$VERIFIED_HEAD_SHA" --jq '.tree.sha')" || {
            echo "::error::Merge has different source tree from emulator-qualified APK"; exit 1;
          }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Preview tag already exists; never overwrite a published APK"; exit 1;
          fi

      - uses: actions/download-artifact@v4
        with:
          name: SevenCode-Android-Web-offline-emulator-verified
          run-id: 40262890094
          github-token: ${{ github.token }}
          path: input-artifact

      - name: Verify exactly one standalone original Code OSS APK, locale and checksum
        run: |
          set -euo pipefail
          test "$(find input-artifact -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          (cd input-artifact && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          import json
          import zipfile
          apk, = Path("input-artifact").glob("*.apk")
          assert apk.stat().st_size > 50_000_000, "Refusing thin APK"
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None, "APK CRC invalid"
              names = set(z.namelist())
              required = {
                  "assets/seven-web/index.html",
                  "assets/seven-web/bootstrap.js",
                  "assets/seven-web/out/nls.messages.js",
                  "assets/seven-web/out/vs/workbench/workbench.web.main.internal.js",
                  "assets/seven-web/extensions/github-authentication/dist/browser/extension.js",
                  "assets/seven-web/extensions/copilot-chat/dist/web.js",
                  "assets/seven-web/extensions/seven-code-mobile-terminal/dist/browser/extension.js",
                  "assets/seven-web/licenses/vscode-loc-LICENSE.md",
                  "lib/arm64-v8a/libsevenpty.so",
              }
              assert required <= names, f"Missing components: {required - names}"
              meta = json.loads(z.read("assets/seven-web/bundle.json"))
              assert meta["kind"] == "original-code-oss-standalone-web"
              assert meta.get("uiLanguage") == "pt-br"
              assert meta["uiTranslations"]["translated"] >= 500
              assert meta.get("remoteNodeExtensions") is False
              core = z.read("assets/seven-web/out/vs/workbench/workbench.web.main.internal.js")
              assert b"keyboard-request" in core
              assert b"sevenCode.githubSignIn" in core
              assert b"sevenCode.openAndroidFolder" in core
              assert b"sevenCode.copilotStatus" in core
              assert b"sevenCode.openAndroidTerminal" in core
              assert b"sevenCode.githubSessionStatus" in core
              assert b"sevenCode.configureAndroidAiFeatures" in core
              nls = z.read("assets/seven-web/out/nls.messages.js")
              assert b'_VSCODE_NLS_LANGUAGE = "pt-br"' in nls
              print("Verified original Code OSS Android APK, pt-BR, native keyboard bridge and actionable menu commands")
          PY
          mkdir -p release-assets
          cp input-artifact/SevenCode-Android-Web-offline-tested-debug.apk release-assets/SevenCode-v0.2.0-android-web-preview.4-debug.apk
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          test "$(find release-assets -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          # Refuse to publish if someone recompressed or changed the tested APK.
          test "$(sha256sum input-artifact/SevenCode-Android-Web-offline-tested-debug.apk | cut -d' ' -f1)" = "$(sha256sum release-assets/SevenCode-v0.2.0-android-web-preview.4-debug.apk | cut -d' ' -f1)"

      - name: Publish test-only GitHub prerelease (NOT production)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 617c6a404c474aca3146abcac4eb97532f9c41c7
          RELEASE_TAG: v0.2.0-android-web-preview.4
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## Seven Code Preview 4 — TESTE Android (instalação independente)

          APK único com o editor Code OSS Web original e terminal nativo Android. Identificação **dev.seven.code.preview4** e nome visível **Seven Code Preview 4**.

          **Alterações:** preserva a WebView e os buffers ao girar a tela, adiciona um comando de toque para abrir o terminal Android e um perfil padrão (quando ainda não definido); vincula o botão "Usar recursos de IA" à verificação do provedor GitHub/Copilot; expõe diagnóstico da sessão GitHub e do Git local; oculta rótulos Ctrl/Cmd inadequados em tela touch, mantendo o teclado físico.

          **Homologação CI Android API 35:** APK compilado, assinado e íntegro, instalado lado a lado com a Preview 2 e Preview 3 existentes; testes instrumentados de renderização Code OSS, teclado e rotação executados com sucesso. Verificações Node e Kotlin concluídas.

          **Pendências de uso real:** OAuth e persistência GitHub com conta pessoal, acesso efetivo aos modelos oficiais Copilot, sincronização Git local, compatibilidade com extensões Node.js, e instalações em modelos de celular específicos. O botão de IA apresenta diagnóstico real e não finge ativação. O pacote Web não contém o runtime Node completo do desktop.

          **Não desinstale a instalação anterior para testar.** Esta prévia tem um ID Android separado para evitar conflito entre assinaturas debug do CI; projetos e preferências são isolados entre as duas versões.

          Pipeline com APK idêntico: https://github.com/gabriell211/Seven-code/actions/runs/40262890094
          Código testado: https://github.com/gabriell211/Seven-code/commit/c788a11f2136d99c17e6c1cee0db152908f085b8
          Código integrado: https://github.com/gabriell211/Seven-code/commit/617c6a404c474aca3146abcac4eb97532f9c41c7
          NOTES
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh release create "$RELEASE_TAG" release-assets/*.apk release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Seven Code Preview 4 — rotacao, terminal e GitHub/Copilot (teste)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease --latest=false
